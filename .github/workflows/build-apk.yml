name: Build & Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== JAVA_HOME ==="
          echo "JAVA_HOME: $JAVA_HOME"

          VERSION_OUTPUT=$(java -version 2>&1)
          VERSION_STR=$(echo "$VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}')
          if [ -z "$VERSION_STR" ]; then
            echo "ERROR: Failed to detect Java version string."
            exit 1
          fi
          echo "Detected Java version string: $VERSION_STR"

          JAVA_MAJOR=$(echo "$VERSION_STR" | awk -F '.' '{print $1}')
          if [[ -z "$JAVA_MAJOR" || ! "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Failed to parse Java major version from '$VERSION_STR'."
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "debug.keystore not found. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore could not be found or created."
            exit 1
          fi
          echo "Temporary debug keystore confirmed."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files within app/build/outputs/apk:"
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is empty (0 bytes)."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "ERROR: $EXPECTED_APK does not have the .apk extension."
            exit 1
          fi

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is '$EXPECTED_APK', not exactly 'app/build/outputs/apk/debug/app-debug.apk'."
            exit 1
          fi

          echo "APK verification passed: $EXPECTED_APK is valid and non-empty."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="android-app"
          fi

          RELEASE_ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_DIR="${RUNNER_TEMP}/release_asset"
          mkdir -p "$TEMP_DIR"

          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          TARGET_ASSET="$TEMP_DIR/$RELEASE_ASSET_NAME"

          cp "$SOURCE_APK" "$TARGET_ASSET"

          if [ ! -f "$TARGET_ASSET" ] || [ ! -s "$TARGET_ASSET" ]; then
            echo "ERROR: Failed to prepare release asset at $TARGET_ASSET"
            exit 1
          fi

          echo "asset_path=$TARGET_ASSET" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_ASSET ($RELEASE_ASSET_NAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi

          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset is empty: $ASSET_PATH"
            exit 1
          fi

          if [[ "$ASSET_PATH" != *.apk ]]; then
            echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          cat << 'EOF' > release_notes.md
          ### Debug APK Build Information
          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}

          ---
          > **Notice:**
          > - This APK is intended for testing.
          > - This APK is not a Play Store production release.
          > - This APK is signed only with a temporary debug keystore.
          EOF

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Release publishing succeeded!"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            RELEASE_TITLE=$(gh release view "$RELEASE_TAG" --json title -q .title 2>/dev/null || echo "Debug APK Build #${GITHUB_RUN_NUMBER}")

            echo "=========================================="
            echo "Release Tag:       $RELEASE_TAG"
            echo "Release Title:     $RELEASE_TITLE"
            echo "Release Page URL:  $RELEASE_URL"
            echo "APK Asset File:    $ASSET_NAME"
            echo "=========================================="

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "**Status:** Debug APK built and published successfully to GitHub Releases."
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "### 📲 How to Download"
              echo "The debug APK (\`$ASSET_NAME\`) can be downloaded directly on your phone or computer from the **Assets** section of the [GitHub Release page]($RELEASE_URL)."
              echo ""
              echo "> **Backup:** The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available under the Actions run artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed or was skipped."
            echo "The APK build succeeded, and the Actions artifact named 'app-debug-apk' remains available."

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "**Status:** The debug APK was built successfully and saved as a GitHub Actions artifact."
              echo ""
              echo "> **Note:** GitHub Release publishing did not complete (outcome: $RELEASE_OUTCOME). However, your build is safe!"
              echo ""
              echo "### 📦 Download Actions Artifact"
              echo "The compiled debug APK is available as a GitHub Actions artifact named **\`app-debug-apk\`** under the Artifacts section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
